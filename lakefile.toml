name = "leancompcert"
version = "0.2.0"
defaultTargets = ["LeanCompCert", "LeanCompCertTrusted", "lean-compcert", "lean-compcert-tests"]

[[lean_lib]]
name = "LeanCompCert"

# Opt-in artifact-run bridge.  A SEPARATE library: nothing in `LeanCompCert`
# imports it, so depending on this package still adds no axioms.  It is a
# default target only so that `lake build` type-checks and audits it.
[[lean_lib]]
name = "LeanCompCertTrusted"

[[lean_exe]]
name = "lean-compcert"
root = "LeanCompCert.Main"

# Test-support modules.  A library so that `LeanCompCertTests.*` submodules
# resolve; the executable below is rooted at the same top module.  This is
# test-only and is not part of the public API surface.
[[lean_lib]]
name = "LeanCompCertTests"
globs = ["LeanCompCertTests", "LeanCompCertTests.+"]

[[lean_exe]]
name = "lean-compcert-tests"
root = "LeanCompCertTests"
