# leancompcert-evidence.cfg — project resolution policy for `evidenced_decide`
#
# The Lean source states the obligation; this file states how it is resolved.
# Nothing here can assert a result: `RunEvidence.verify` still checks that what
# arrives is well formed and answers the claim.  Changing this file does not
# change any proof term — only which evidence record the proof cites.
#
# There is no built-in default.  Deleting this file makes `evidenced_decide`
# fail rather than quietly picking the weakest option.

# Ordered preference.  `attest` first — use attestation when it is available —
# then `cache`, the stamp left by an earlier run on this machine.  `run` is
# deliberately absent from the project policy: a routine build should never
# execute an artifact.
policy = attest, cache

evidence-dir = evidence
ledger = evidence/ledger.log
producer = ./scripts/produce-evidence.sh

# Refuse a record that was produced on another machine.  A stamp travelling in
# a container image or an rsync'd checkout is the realistic accident.
require-live-machine = true
